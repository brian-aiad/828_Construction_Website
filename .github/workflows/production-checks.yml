name: Production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use project Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build with type validation
        run: npm run build

      - name: Audit rendered SEO and crawl responses
        run: npm run audit:seo

      - name: Test contact request handling
        run: npm run test:contact

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test production pages and interactions across browsers
        run: npm run test:release

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
